name: heritage-trace

# Default competition-demo stack. It deliberately has no model dependency:
# the API runs its deterministic fixture workflow and the browser talks to it
# through the Next.js server-side proxy.
services:
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    env_file:
      - path: ./.env
        required: false
    environment:
      QWENPAW_HOST: 0.0.0.0
      QWENPAW_PORT: "8000"
      QWENPAW_DB_PATH: /var/lib/heritage-trace/qwenpaw.db
      QWENPAW_WORKFLOW_EXECUTOR: fixture
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - heritage_trace_data:/var/lib/heritage-trace
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_BASE_URL: http://api:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  heritage_trace_data:
