services:
  qwenpaw:
    build: .
    env_file:
      - .env
    environment:
      QWENPAW_HOST: 0.0.0.0
      QWENPAW_PORT: "8000"
      QWENPAW_DB_PATH: /var/lib/qwenpaw/qwenpaw.db
      QWENPAW_COOKIE_SECURE: "0"
      QWENPAW_SERVE_STATIC: "1"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - qwenpaw_data:/var/lib/qwenpaw
    restart: unless-stopped

volumes:
  qwenpaw_data:
