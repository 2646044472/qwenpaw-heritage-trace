{
  "openapi": "3.1.0",
  "info": {"title": "Heritage Workflow API", "version": "2.0.0"},
  "paths": {
    "/api/v2/heritage/workflows": {"post": {"requestBody": {"required": true, "content": {"application/json": {"schema": {"oneOf": [{"$ref": "#/components/schemas/MiningRequest"}, {"$ref": "#/components/schemas/BundleRequest"}]}}}}, "responses": {"202": {"description": "Accepted", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/WorkflowStatus"}}}}}}},
    "/api/v2/heritage/workflows/{run_id}": {"get": {"parameters": [{"name": "run_id", "in": "path", "required": true, "schema": {"type": "string"}}], "responses": {"200": {"description": "Status", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/WorkflowStatus"}}}}}}},
    "/api/v2/heritage/workflows/{run_id}/result": {"get": {"parameters": [{"name": "run_id", "in": "path", "required": true, "schema": {"type": "string"}}], "responses": {"200": {"description": "Terminal result", "content": {"application/json": {"schema": {"oneOf": [{"$ref": "#/components/schemas/SuccessfulResult"}, {"$ref": "#/components/schemas/FailedResult"}]}}}}}}}
  },
  "components": {"schemas": {
    "MiningRequest": {"type": "object", "additionalProperties": false, "required": ["shop_id", "shop_name"], "properties": {"shop_id": {"const": "lei-kei-001"}, "shop_name": {"type": "string", "minLength": 1}, "case_id": {"type": "string", "minLength": 1}, "aliases": {"type": "array", "items": {"type": "string"}}, "location_hint": {"type": "string"}}},
    "BundleRequest": {"type": "object", "additionalProperties": false, "required": ["source_bundle"], "properties": {"source_bundle": {"$ref": "#/components/schemas/SourceBundle"}}},
    "SourceBundle": {"type": "object", "additionalProperties": false, "required": ["case_id", "shop_id", "shop_name", "sources"], "properties": {"case_id": {"type": "string", "minLength": 1}, "shop_id": {"const": "lei-kei-001"}, "shop_name": {"type": "string", "minLength": 1}, "sources": {"type": "array", "minItems": 1, "items": {"$ref": "#/components/schemas/Source"}}}},
    "Source": {"type": "object", "additionalProperties": false, "required": ["source_id", "content_type"], "properties": {"source_id": {"type": "string", "minLength": 1}, "content_type": {"enum": ["original_text", "evidence_extract", "retrieved_text", "normalized_note", "search_extract", "url_only"]}, "content": {"type": "string"}, "evidence": {"type": ["array", "null"], "items": {"$ref": "#/components/schemas/Evidence"}}, "url": {"type": ["string", "null"]}, "publisher": {"type": ["string", "null"]}, "source_family": {"type": "string"}, "source_type": {"type": "string"}, "authorization": {}, "limits": {}}},
    "Evidence": {"type": "object", "additionalProperties": false, "required": ["text", "locator"], "properties": {"text": {"type": "string"}, "locator": {"type": ["string", "null"]}}},
    "AgentState": {"type": "object", "additionalProperties": false, "required": ["status", "session_id"], "properties": {"status": {"enum": ["not_started", "running", "completed", "failed", "skipped"]}, "session_id": {"type": ["string", "null"]}}},
    "Agents": {"type": "object", "additionalProperties": false, "required": ["miner", "archivist", "verifier"], "properties": {"miner": {"$ref": "#/components/schemas/AgentState"}, "archivist": {"$ref": "#/components/schemas/AgentState"}, "verifier": {"$ref": "#/components/schemas/AgentState"}}},
    "ErrorItem": {"type": "object", "additionalProperties": false, "required": ["path", "code", "message"], "properties": {"path": {"type": "string"}, "code": {"type": "string"}, "message": {"type": "string"}}},
    "WorkflowStatus": {"type": "object", "additionalProperties": false, "required": ["run_id", "shop_id", "case_id", "route", "state", "workflow_status", "agents", "errors"], "properties": {"run_id": {"type": "string"}, "shop_id": {"const": "lei-kei-001"}, "case_id": {"type": ["string", "null"]}, "route": {"enum": ["mine", "bundle"]}, "state": {"enum": ["input_received", "agent_resolution", "miner_running", "sources_normalized", "archivist_running", "archivist_validated", "verifier_running", "finalizing", "finished", "completed_with_errors"]}, "workflow_status": {"enum": ["running", "finished", "completed_with_errors"]}, "agents": {"$ref": "#/components/schemas/Agents"}, "errors": {"type": "array", "items": {"$ref": "#/components/schemas/ErrorItem"}}}},
    "ScalarField": {"type": "object", "additionalProperties": false, "required": ["value", "claim_id"], "properties": {"value": {"type": ["string", "number", "null"]}, "claim_id": {"type": "string"}}},
    "ValueClaim": {"type": "object", "additionalProperties": false, "required": ["value", "claim_id"], "properties": {"value": {"type": "string"}, "claim_id": {"type": "string"}}},
    "NameClaim": {"type": "object", "additionalProperties": false, "required": ["name", "claim_id"], "properties": {"name": {"type": "string"}, "claim_id": {"type": "string"}}},
    "PersonClaim": {"type": "object", "additionalProperties": false, "required": ["name", "role", "claim_id"], "properties": {"name": {"type": "string"}, "role": {"type": "string"}, "claim_id": {"type": "string"}}},
    "EventClaim": {"type": "object", "additionalProperties": false, "required": ["date", "description", "claim_id"], "properties": {"date": {"type": "string"}, "description": {"type": "string"}, "claim_id": {"type": "string"}}},
    "OperationClaim": {"type": "object", "additionalProperties": false, "required": ["label", "claim_id"], "properties": {"label": {"type": "string"}, "claim_id": {"type": "string"}}},
    "RevisedAssetCard": {"type": "object", "additionalProperties": false, "required": ["shop_name", "founding_year", "street_stall_start_date", "first_shop_opening_date", "address", "product_categories", "products", "persons", "key_events", "operations"], "properties": {"shop_name": {"$ref": "#/components/schemas/ScalarField"}, "founding_year": {"$ref": "#/components/schemas/ScalarField"}, "street_stall_start_date": {"$ref": "#/components/schemas/ScalarField"}, "first_shop_opening_date": {"$ref": "#/components/schemas/ScalarField"}, "address": {"$ref": "#/components/schemas/ScalarField"}, "product_categories": {"type": "array", "items": {"$ref": "#/components/schemas/ValueClaim"}}, "products": {"type": "array", "items": {"$ref": "#/components/schemas/NameClaim"}}, "persons": {"type": "array", "items": {"$ref": "#/components/schemas/PersonClaim"}}, "key_events": {"type": "array", "items": {"$ref": "#/components/schemas/EventClaim"}}, "operations": {"type": "array", "items": {"$ref": "#/components/schemas/OperationClaim"}}}},
    "StatusCounts": {"type": "object", "additionalProperties": false, "required": ["supported", "partially_supported", "unsupported", "unverifiable"], "properties": {"supported": {"type": "integer", "minimum": 0}, "partially_supported": {"type": "integer", "minimum": 0}, "unsupported": {"type": "integer", "minimum": 0}, "unverifiable": {"type": "integer", "minimum": 0}}},
    "CitationCounts": {"type": "object", "additionalProperties": false, "required": ["correct", "partially_incorrect", "incorrect", "not_applicable"], "properties": {"correct": {"type": "integer", "minimum": 0}, "partially_incorrect": {"type": "integer", "minimum": 0}, "incorrect": {"type": "integer", "minimum": 0}, "not_applicable": {"type": "integer", "minimum": 0}}},
    "LevelCounts": {"type": "object", "additionalProperties": false, "required": ["source_evidence", "bundle_consistency", "unverifiable"], "properties": {"source_evidence": {"type": "integer", "minimum": 0}, "bundle_consistency": {"type": "integer", "minimum": 0}, "unverifiable": {"type": "integer", "minimum": 0}}},
    "VerificationSummary": {"type": "object", "additionalProperties": false, "required": ["total_claims", "by_status", "by_citation_status", "by_level", "by_risk_flag"], "properties": {"total_claims": {"type": "integer", "minimum": 0}, "by_status": {"$ref": "#/components/schemas/StatusCounts"}, "by_citation_status": {"$ref": "#/components/schemas/CitationCounts"}, "by_level": {"$ref": "#/components/schemas/LevelCounts"}, "by_risk_flag": {"type": "object", "additionalProperties": {"type": "integer", "minimum": 0}}}},
    "Issue": {"type": "object", "additionalProperties": false, "required": ["claim_id", "issue_type", "description", "recommended_action"], "properties": {"claim_id": {"type": "string"}, "issue_type": {"enum": ["source_conflict", "unsupported_claim", "citation_error", "time_context_loss", "insufficient_locator", "authorization_risk", "field_semantic_mismatch", "over_inference", "privacy_risk", "content_nature_violation", "false_evidence_level"]}, "description": {"type": "string"}, "recommended_action": {"type": "string"}}},
    "SuccessfulResult": {"type": "object", "additionalProperties": false, "required": ["schema_version", "shop_id", "case_id", "workflow_status", "agents", "verification_summary", "asset_card", "issues", "publication_status"], "properties": {"schema_version": {"const": "2.0"}, "shop_id": {"const": "lei-kei-001"}, "case_id": {"type": "string"}, "workflow_status": {"const": "finished"}, "agents": {"$ref": "#/components/schemas/Agents"}, "verification_summary": {"$ref": "#/components/schemas/VerificationSummary"}, "asset_card": {"$ref": "#/components/schemas/RevisedAssetCard"}, "issues": {"type": "array", "items": {"$ref": "#/components/schemas/Issue"}}, "publication_status": {"enum": ["publishable", "needs_review", "not_publishable"]}}},
    "FailedResult": {"type": "object", "additionalProperties": false, "required": ["schema_version", "shop_id", "case_id", "workflow_status", "failed_stage", "agents", "errors"], "properties": {"schema_version": {"const": "2.0"}, "shop_id": {"const": "lei-kei-001"}, "case_id": {"type": ["string", "null"]}, "workflow_status": {"const": "completed_with_errors"}, "failed_stage": {"enum": ["input_invalid", "agent_resolution_failed", "miner_failed", "source_normalization_failed", "archivist_output_incomplete", "verifier_output_incomplete", "finalization_failed"]}, "agents": {"$ref": "#/components/schemas/Agents"}, "errors": {"type": "array", "items": {"$ref": "#/components/schemas/ErrorItem"}}}}
  }}
}
